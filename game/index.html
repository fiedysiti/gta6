<!DOCTYPE html>
<!-- Recovery note: the single page that boots the game — it loads the vendored three.js, the HUD shell, and the main module. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>NEON BAY — open-world crime</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #14092b;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  #nb-loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffd23d;
    font: bold 20px Arial, Helvetica, sans-serif;
    letter-spacing: 2px;
    z-index: 1;
  }
</style>
</head>
<body>
<div id="nb-loading">NEON BAY is loading&hellip;</div>
<!--
  NEON BAY: an original open-world crime game. Rex Marlowe has to clear
  $5,000 in Neon Bay before the NBPD catches him. No network requests,
  no external assets — three.js is vendored below and every texture and
  sound is generated in code.

  Controls: WASD move / drive, Shift sprint, E enter a car (hold E in a
  gold $ ring to rob), F punch, mouse drag to orbit the camera,
  P / Esc pause, M mute, Enter start / restart.
-->
<script src="vendor/three.min.js"></script>
<script type="module">
  // main.js builds the world, the HUD and the loop; once it has booted
  // (its top-level evaluation finishes), this loading note goes away.
  import './src/main.js';
  document.getElementById('nb-loading')?.remove();
</script>
</body>
</html>
